[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalis-voice-agent"
version = "0.1.0"
description = "Vocalis - A voice-first, JARVIS-style agent ecosystem with speaker authentication, unified TTS, and local-model task monitoring."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Vocalis Contributors" },
]
keywords = [
    "voice-agent",
    "speaker-verification",
    "tts",
    "asr",
    "llm-agent",
    "jarvis",
    "ai-assistant",
    "task-monitoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
voice = [
    "resemblyzer>=0.1.3",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "sounddevice>=0.4.6",
    "scipy>=1.10",
]
local-brain = [
    "ollama>=0.3",
]
all = [
    "vocalis-voice-agent[voice,local-brain]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/vocalis-ai/vocalis"
Repository = "https://github.com/vocalis-ai/vocalis"
Documentation = "https://github.com/vocalis-ai/vocalis/tree/main/docs"
Changelog = "https://github.com/vocalis-ai/vocalis/blob/main/CHANGELOG.md"
Issues = "https://github.com/vocalis-ai/vocalis/issues"

[project.scripts]
vocalis = "vocalis.cli:app"

[tool.setuptools.packages.find]
include = ["vocalis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
