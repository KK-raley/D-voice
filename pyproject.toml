[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalis-voice-agent"
version = "0.1.0"
description = "Vocalis - A voice-first, D-VOICE-style agent ecosystem with speaker authentication, unified TTS, and local-model task monitoring."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Vocalis Contributors" },
]
keywords = [
    "voice-agent",
    "speaker-verification",
    "tts",
    "asr",
    "llm-agent",
    "jarvis",
    "d-voice",
    "ai-assistant",
    "task-monitoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
voice = [
    "resemblyzer>=0.1.3",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "sounddevice>=0.4.6",
    "scipy>=1.10",
]
voiceprint = [
    # ERes2Net-large (3D-Speaker SOTA) speaker verification via ModelScope
    "modelscope>=1.14",
    "torch>=2.1",
    "torchaudio>=2.1",
    "scipy>=1.10",
]
local-brain = [
    "ollama>=0.3",
]
wakeword = [
    # Always-on wake-word detection ("hey D-VOICE") via openwakeword
    # tflite-runtime is pulled in by openwakeword itself; we do not list it
    # explicitly because it is not available on every Linux arch (e.g. ARM).
    # The code degrades gracefully when tflite-runtime is missing.
    "openwakeword>=0.5",
]
mcp = [
    # MCP (Model Context Protocol) server for coding-agent integration
    "mcp>=1.0",
]
all = [
    "vocalis-voice-agent[voice,local-brain,wakeword,mcp]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/KK-raley/D-voice"
Repository = "https://github.com/KK-raley/D-voice"
Documentation = "https://github.com/KK-raley/D-voice/tree/main/docs"
Changelog = "https://github.com/KK-raley/D-voice/blob/main/CHANGELOG.md"
Issues = "https://github.com/KK-raley/D-voice/issues"

[project.scripts]
vocalis = "vocalis.cli:app"

[tool.setuptools.packages.find]
include = ["vocalis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented pattern is `typer.Option(...)` in argument defaults.
"vocalis/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 缺 pytest-asyncio 时 async 测试会被静默跳过且 exit 0——升级为硬错误。
# 注意：不能写 error::pytest.PytestUnhandledCoroutineWarning——该警告类在
# pytest 8.4 已移除（未处理协程测试直接 fail），引用它会让 8.4+ 启动即崩；
# 故按消息文本匹配（8.0~8.3 该警告即此文本；8.4+ 无此警告，规则无副作用）。
filterwarnings = ["error:async def functions are not natively supported"]
